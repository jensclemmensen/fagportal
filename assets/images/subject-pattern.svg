    <!-- Kolbe (kemi) -->
    <g transform="translate(230,55) rotate(6)">
      <path d="M -8,-30 L -8,-8 L -26,32 Q -22,40 26,40 Q 30,40 26,32 L 8,-8 L 8,-30"/>
      <path d="M -12,-30 L 12,-30"/>
