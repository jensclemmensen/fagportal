      <path d="M 9,8 L -9,16" stroke-width="2.4"/>
      <path d="M -9,32 L 9,40" stroke-width="2.4"/>
    </g>

    <!-- Musiknode (musik) -->
    <g transform="translate(255,235) rotate(-8)">
      <ellipse cx="-14" cy="26" rx="11" ry="8" fill="#6592e6" stroke="none" transform="rotate(-18 -14 26)"/>
      <path d="M -4,26 L -4,-30 Q 16,-24 12,-4"/>
