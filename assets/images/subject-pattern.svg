      <circle cx="10" cy="12" r="1.6" fill="#6592e6" stroke="none"/>
    </g>

    <!-- DNA-spiral (biologi) -->
    <g transform="translate(58,214)" stroke-width="3">
      <path d="M -13,-58 C -7,-53 -2,-51 -4,-48 C 14,-40 14,-32 4,-24 C -14,-16 -14,-8 -4,0 C 14,8 14,16 4,24 C -14,32 -14,40 -4,48 C -2,51 3,54 11,59"/>
      <path d="M 13,-58 C 7,-53 2,-51 4,-48 C -14,-40 -14,-32 -4,-24 C 14,-16 14,-8 4,0 C -14,8 -14,16 -4,24 C 14,32 14,40 4,48 C 2,51 -3,54 -11,59"/>
      <path d="M 9,-40 L -9,-32" stroke-width="2.4"/>
